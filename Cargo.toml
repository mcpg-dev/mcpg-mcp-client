[package]
name = "mcpg-mcp-client"
version = "0.1.0-beta.13"
edition = "2024"
license = "Apache-2.0"
description = "The MCP client mcpg dials with — both wires, SEP-2575 probe, SSRF-guarded transports"

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
futures = "0.3"
mcpg-mcp-wire = { git = "https://github.com/mcpg-dev/mcpg-mcp-wire", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
mcpg-plugin-backend-net-core = { git = "https://github.com/mcpg-dev/mcpg-plugin-backend-net-core", tag = "v0.1.0-beta.13", version = "=0.1.0-beta.13" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = { version = "0.8", default-features = false, features = ["derive", "preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["full"] }
tracing = "0.1"
url = "2.5.8"

[dev-dependencies]
axum = "0.8"
tempfile = "3"

[lints.clippy]
result_large_err = "allow"
large_enum_variant = "allow"